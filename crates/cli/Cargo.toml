[package]
name = "playlist-cli"
version = "0.1.0"
authors = ["Oliver Coleman <oliver.coleman@gmail.com>"]
edition = "2024"

[[bin]]
name = "playlist-cli"
path = "src/main.rs"

[dependencies]
playlist-core = { path = "../core", features = ["server"] }
futures = { workspace = true }
mongodb = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
url-parse = { workspace = true }
chrono = { workspace = true }
