[workspace]
members = ["crates/core", "crates/web", "crates/cli"]
resolver = "2"

[workspace.dependencies]
chrono = "0.4.43"
dioxus = { version = "0.7.3" }
futures = "0.3.31"
mongodb = "3.5.0"
regex = "1.12.2"
rphonetic = "3.0"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
tracing = "0.1.44"
url-parse = "1.0.10"
spotify-rs = "0.4.1"
