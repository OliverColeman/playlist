[workspace]
members = ["crates/core", "crates/web", "crates/cli"]
resolver = "2"

[workspace.dependencies]
# Shared dependencies
dioxus = { version = "0.7.2" }
chrono = "0.4.42"
serde = "1.0.228"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
mongodb = "3.4.1"
tracing = "0.1.44"
serde_json = "1.0.148"
futures = "0.3.31"
regex = "1.12.2"
