name: justdance-archives

services:
  # Reverse proxy: terminates TLS (automatic HTTPS via Let's Encrypt) and
  # forwards to the web container over the internal network. This is the only
  # service that publishes ports to the host.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80" # HTTP — used for ACME challenges and redirect to HTTPS
      - "443:443" # HTTPS
    environment:
      # Your public domain, e.g. playlist.example.com — Caddy obtains a cert for it.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in your env file}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # persisted certificates — keep this volume!
      - caddy_config:/config
    depends_on:
      - web

  web:
    image: ghcr.io/olivercoleman/playlist:latest
    pull_policy: always
    restart: unless-stopped
    # No published ports — only Caddy reaches it, over the internal network.
    expose:
      - "8080"
    # All credentials and per-service settings (SITE_ADDRESS, the music-service
    # client IDs/secrets, market/country, DB_NAME) come straight from
    # .playlist.env, so adding a new credential there needs no change here. The
    # command-line tool inherits this same environment via `docker compose exec
    # web playlist-cli ...`.
    env_file:
      - .playlist.env
    # Fixed infrastructure settings. These take precedence over any same-named
    # key in the env file, so the container always binds all interfaces and
    # reaches MongoDB on the internal compose network.
    environment:
      IP: 0.0.0.0
      PORT: 8080
      DB_CONNECTION_STRING: mongodb://mongodb:27017
      # Required by the app (no built-in default); defaulted here so a bare env
      # file still works.
      DB_NAME: ${DB_NAME:-justdance}
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    # Cap the WiredTiger cache so Mongo leaves room for the OS and web server.
    # Sized for a 2 GB host: 0.5 GB cache + ~0.2 GB Mongo overhead leaves
    # ~1.3 GB for the OS, Docker, Caddy, and the web container.
    command: --quiet --wiredTigerCacheSizeGB 0.5
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/27017'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:
